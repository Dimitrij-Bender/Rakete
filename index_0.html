<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rauschschiffschlacht</title>

    <style> 
    canvas {
        background-color: rgba(0, 0, 0, 0.8);

    }
    
    </style>

    <script>
        let KEY_SPACE = false; // 32
        let KEY_UP = false;     //38
        let KEY_DOWN = false;       //40
        let canvas;
        let ctx;
        let backgroundImage = new Image();

        let rocket = {
            //x: 50,
            //y: 100,
            x: Math.floor(Math.random() * 100) + 1,
            y: 100,
            width: 110,
            height: 90,
            src: 'img/rocket_2.png'

        };

        let ufos = [];
        let pistoles = [];
        
        document.onkeydown = function(e) {
            console.log(e.keyCode)
            if(e.keyCode == 32) {       // Lerrtaste gedrückt
                KEY_SPACE = true;
            }
             
            if(e.keyCode == 38) {       // Lerrtaste gedrückt
                KEY_UP = true;
            }
        
            if(e.keyCode == 40) {       // nach oben gedrückt
                KEY_DOWN = true;
            }
        
        
        
        document.onkeyup = function(e) {
            if(e.keyCode == 32) {       // nach oben gedrückt
                KEY_SPACE = false;
            }
            
            if(e.keyCode == 38) {       // Lerrtaste gedrückt
                KEY_UP = false;
            }
        
        
            if(e.keyCode == 40) {       // nach oben gedrückt
                KEY_DOWN = false;
            }
        
        }
    }
        
        
        function startGame() {
            canvas = document.getElementById('canvas');
            ctx = canvas.getContext('2d');
            loadImages();
            setInterval(update, 1000/25);
            setInterval(createUfos, 5000);
            setInterval(checkForCollion, 1000/25);
            serInterval(checkForShoot, 1000 / 10);
            draw();
            //calcute 
        }

        function checkForCollion() {
            ufos.forEach(function(ufo) {

                if(rocket.x + rocket.width > ufo.x &&
                 rocket.y + rocket.height > ufo.y &&
                  rocket.x < ufo.x && 
                  rocket.y < ufo.y + ufo.height
                ) {

                    rocket.img.src = 'img/BOOM.png';
                    console.log('Collion!!!');
                    ufos = ufos.filter(u => u != ufo);
                }

                
            
            pistoles.forEach(function(pistole) {
                if (pistole.x + pistole.width > ufo.x &&
                    pistole.y + pistole.height > ufo.y &&
                    pistole.x < ufo.x &&
                    pistole.y < ufo.y + ufo.height
                    ) {
                        ufo.hit = true;
                        ufo.img.src = 'img/BOON.png';
                        console.log('Collion!!!');

                        setTimeout(() => {
                            ufos = ufos.filter(u => u != ufo);
                            }, 2000);
                    }
                });
            });
        }

        function createUfos() {
            let ufo = { 
            x: 800,
            y: Math.random() * 500,
            width: 100,
            height: 40,
            src: 'img/ufo_1.png',
            img: new Image()
            };
            ufo.img.src = ufo.src;
            
            ufos.push(ufo);
        }
        function checkForShoot() {
            if (KEY_SPACE) {
                let pistole = { 
                    x: rocket.x + 110,
                    y: rocket.y + 22,
                    width: 20,
                    height: 4,
                    src: 'img/Patrone_21.jpeg',
                    img: new Image()
            };
            pistole.img.src = pistole.src;

            pistoles.push(pistole);
        }
        }
             
        function update() {
            if(KEY_UP) {
                rocket.y -= 4;
            }
            if(KEY_DOWN) {
                rocket.y += 4;
            }
            ufos.forEach(function(ufo) {
                if(!ufo.hit) {
                ufo.x -= 5;
                }
            });
            pistoles.forEach(function(pistole) {
                pistole.x += 15;
            });
        }

        function loadImages() {
            backgroundImage.src = 'img/background.jpeg';
            rocket.img = new Image();
            rocket.img.src = rocket.src;
        }

        function draw() {
            ctx.drawImage(backgroundImage, 0, 0);
            ctx.drawImage(rocket.img, rocket.x, rocket.y, rocket.width, rocket.height); 

            ufos.forEach(function(ufo) {
                ctx.drawImage(ufo.img, ufo.x, ufo.y, ufo.width, ufo.height);
            })
            pistoles.forEach(function (pistole) {
                ctx.drawImage(pistole.img, pistole.x, pistole.y, pistole.width, pistole.height);
            });

            requestAnimationFrame(draw);
        }
    </script>
</head>
<body onload="startGame()">
    <canvas id="canvas" width="720"; height="480">  </canvas>
</body>
</html>
